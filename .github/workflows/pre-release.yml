name: Pre-release checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency and license gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.1
          run_install: false
          cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm repository:check
      - run: pnpm licenses:check
      - run: pnpm audit --audit-level low
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  candidate:
    name: Candidate / ${{ matrix.target }}
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: windows-2022
            target: i686-pc-windows-msvc
            bundles: nsis
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.1
          run_install: false
          cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: pnpm test:ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: node scripts/release-candidate.mjs begin "$CARGO_BUILD_TARGET"
      - if: runner.os == 'macOS'
        run: pnpm tauri build --target "$CARGO_BUILD_TARGET" --bundles "${{ matrix.bundles }}" -- --locked
      - if: contains(matrix.target, 'windows')
        run: pnpm installer:windows "$CARGO_BUILD_TARGET"
      # Packaging provisions Tauri's actual NSIS compiler. Require executable
      # installer regressions afterwards instead of silently skipping them.
      - if: contains(matrix.target, 'windows')
        env:
          LLREMOTE_REQUIRE_NSIS: '1'
        run: node --test tests/frontend/app/windowsCompatibility.test.ts tests/frontend/app/windowsPayload.test.ts tests/frontend/app/windowsUpgrade.test.ts tests/frontend/app/windowsInstallers.test.ts tests/frontend/app/windowsUninstall.test.ts
      - run: node scripts/release-candidate.mjs verify "$CARGO_BUILD_TARGET"
